services:
  postgres:
    image: postgres:16-alpine
    container_name: battery-risk-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battery_risk}
      POSTGRES_USER: ${POSTGRES_USER:-battery_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battery_app_password}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - battery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: battery-risk-chroma
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - battery_chroma_data:/data
    restart: unless-stopped

  fastapi:
    build: ./fastapi-ai
    container_name: battery-risk-fastapi
    # Swagger로 RAG 에이전트의 조항 유형(clause_type) 판별 테스트 시 필요 (개발용 — 프론트 연동엔 불필요)
    environment:
      # 컨테이너 안에서 Chroma의 포트는 진짜 포트 8000이다(호스트 매핑 8001이 아님).
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      CHROMA_SSL: "false"
      CHROMA_COLLECTION_PREFIX: ${CHROMA_COLLECTION_PREFIX:-contract_documents}
      # 기본값 openai(2026-07-31부터, 팀 전체 OPENAI_API_KEY 공유됨). mock 해싱 임베딩은
      # 한국어 질의↔영어 계약서 사이 교차언어 검색을 전혀 못 해 실제 조항을 못 찾는 문제를
      # 실증으로 확인했다 — .env에 OPENAI_API_KEY 없이 이 기본값 그대로 두면 임베딩 호출이
      # 401로 실패하니, 로컬에서 키 없이 돌리려면 .env에 EMBEDDING_PROVIDER=mock을 명시할 것.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-3072}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      # 브리핑 생성 LLM(claude-sonnet-5). 없으면 use_llm=true여도 LLM 호출이 실패한다.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 기본 30s는 구조화 출력(계약 근거 다건 포함) 프롬프트에 실제로 부족해 APITimeoutError로
      # 폴백되는 것을 실증했다(2026-07-31). 여유 있게 잡는다.
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-90}
      # [surin F9] FastAPI supplier_recommendation_service가 Spring /api/v1/suppliers/qualified로 콜백. docker 네트워크에선 서비스명 spring 사용(localhost 아님).
      SPRING_BASE_URL: ${SPRING_BASE_URL:-http://spring:8080}
      # kg_service는 Docker 밖(호스트)에서 도는 별도 프로세스라 host.docker.internal로 접근한다.
      # (spring 서비스의 KG_SERVICE_BASE_URL과 동일한 값 — .env에서 한 번만 설정)
      KG_SERVICE_BASE_URL: ${KG_SERVICE_BASE_URL:-http://host.docker.internal:8100}
      # KG 게이트 on/off. 기본 true(운영 동작 그대로).
      # kg_service가 안 떠 있으면 리졸버가 "매칭 없음"으로 폴백하고 게이트가 모든 건을 조기
      # 종료시켜, procurement_risk_assessments에 erp_exposure_score=NULL·NORMAL만 쌓인다.
      # false로 두면 게이트를 통과시켜 ERP·계약·위험도·브리핑 노드를 그대로 태운다.
      #   ⚠️ 우회한 실행은 KG가 확정한 결과가 아니다 — warnings에 그 사실이 남는다.
      #   ⚠️ 게이트를 열면 모든 건이 LLM 노드를 타므로 호출 비용이 실제로 발생한다.
      #      확인이 끝나면 다시 true로 되돌릴 것.
      KG_GATE_ENABLED: ${KG_GATE_ENABLED:-true}
      SEVERITY_RULE_VERSION: ${SEVERITY_RULE_VERSION:-severity-rule-v1}
      # LLM 추출을 mock으로 대체할지. 기본 true — 켜면 /analyze 한 건마다 실제 OpenAI 추출이
      # 나가므로, COLLECTION_ANALYSIS_ENABLED·RISK_SCORING_ENABLED와 같은 방침으로 기본 off다.
      # 실제 추출을 검증할 때만 MOCK_MODE=false로 덮어쓴다.
      # ("true" 하드코딩이었으나 셸에서 덮어쓸 수 없어 변수 형태로 바꿨다.)
      MOCK_MODE: ${MOCK_MODE:-true}
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      - chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  spring:
    build: ./spring-backend
    container_name: battery-risk-spring
    environment:
      # 서비스 이름(postgres/fastapi)이 곧 컨테이너 네트워크의 호스트명이 된다.
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-battery_risk}
      POSTGRES_USER: ${POSTGRES_USER:-battery_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battery_app_password}
      FASTAPI_BASE_URL: http://fastapi:8000
      # kg_service는 Docker 밖(호스트)에서 도는 별도 프로세스라 컨테이너 네트워크 서비스명이
      # 아니라 host.docker.internal로 접근해야 한다(.env에 KG_SERVICE_BASE_URL로 설정).
      KG_SERVICE_BASE_URL: ${KG_SERVICE_BASE_URL:-http://host.docker.internal:8100}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-override-in-env-32bytes+}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-3600}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-1209600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:4173}
      UPLOAD_ROOT: /app/uploads
      ERP_SEED_ENABLED: ${ERP_SEED_ENABLED:-false}
      ERP_SEED_DIRECTORY: /app/erp-seed
      OUTBOUND_ERP_SEED_ENABLED: ${OUTBOUND_ERP_SEED_ENABLED:-false}
      OUTBOUND_ERP_SEED_DIRECTORY: /app/outbound-erp-seed

      RAG_SEED_ENABLED: ${RAG_SEED_ENABLED:-false}
      RAG_SEED_DIRECTORY: /app/rag-seed
      OUTBOUND_RAG_SEED_ENABLED: ${OUTBOUND_RAG_SEED_ENABLED:-false}
      OUTBOUND_RAG_SEED_DIRECTORY: /app/outbound-rag-seed
      AUTH_TEST_SEED_ENABLED: ${AUTH_TEST_SEED_ENABLED:-false}
      # 뉴스 수집(GDELT)은 로컬 XGBoost·공개 파일만 써서 비용이 없지만, 수집된 뉴스마다 도는
      # F3 분석은 OpenAI 추출을 호출한다. 공개 뉴스 속보 패널은 수집 원본만으로 채워지므로
      # 둘 다 기본 off로 두고, 비용이 나가는 쪽을 명시적으로 켜게 한다.
      # 분석까지 돌리려면 COLLECTION_ANALYSIS_ENABLED=true. 단건 검증용 POST /collection/test-news는
      # 이 플래그와 무관하게 항상 동작하므로, 기본 off로 두어도 분석 테스트 경로는 막히지 않는다.
      COLLECTION_SCHEDULER_ENABLED: ${COLLECTION_SCHEDULER_ENABLED:-false}
      COLLECTION_ANALYSIS_ENABLED: ${COLLECTION_ANALYSIS_ENABLED:-false}
      # 제목 한국어 번역(5분 주기). 분석과 독립이며 훨씬 싸다 — 제목만 번역하므로 기사당 약 $0.00004.
      # 기본 off인 이유는 analysis-enabled와 같다: LLM 호출이라 켠 걸 깜빡하면 비용이 계속 나간다.
      COLLECTION_TRANSLATION_ENABLED: ${COLLECTION_TRANSLATION_ENABLED:-false}
      # 환율(공개 대시보드 ② 밴드). 한국수출입은행 무료 공개 API라 비용이 없어 스케줄러는 기본 on이지만,
      # 인증키가 없으면 수집을 조용히 건너뛰므로 키 미설정 상태로 띄워도 부팅에는 문제가 없다.
      KOREAEXIM_API_KEY: ${KOREAEXIM_API_KEY:-}
      EXCHANGE_RATE_SCHEDULER_ENABLED: ${EXCHANGE_RATE_SCHEDULER_ENABLED:-true}
      EXCHANGE_RATE_CURRENCIES: ${EXCHANGE_RATE_CURRENCIES:-USD,EUR,CNH,CLP,AUD,IDR,CDF,ARS,ZAR,BRL,PHP,JPY,CAD,MYR}
      # 수출입은행이 고시하지 않는 조달국 통화(칠레·아르헨티나·콩고·남아공·브라질·필리핀)를
      # USD 경유로 계산한다. 키 불필요하지만 화면에 "Rates By Exchange Rate API" 표기가 필요하다.
      EXCHANGE_RATE_CROSS_ENABLED: ${EXCHANGE_RATE_CROSS_ENABLED:-true}
      EXCHANGE_RATE_CROSS_CURRENCIES: ${EXCHANGE_RATE_CROSS_CURRENCIES:-CLP,ARS,CDF,ZAR,BRL,PHP}
      # 원자재 가격(공개 대시보드 가격 추이). yfinance는 인증키가 없는 비공식 경로라 비용은 0이지만
      # Yahoo가 호출 빈도를 조일 수 있다. 두 스케줄러를 따로 끌 수 있게 나눠 둔다.
      #   SCHEDULER_ENABLED  매일 07:00 전체 갱신(180일). 끄면 가격 수집이 통째로 멈춘다.
      #   INTRADAY_ENABLED   15분 장중 갱신(최근 5일). 끄면 하루 1회 갱신으로 돌아간다.
      #                      호출량 종목 7개 × 96회 = 약 672회/일. 429가 잦으면 여기부터 끈다.
      #   INTRADAY_CRON      빈도 조절용. 예: 30분 주기는 "0 */30 * * * *"
      MARKET_PRICE_SCHEDULER_ENABLED: ${MARKET_PRICE_SCHEDULER_ENABLED:-true}
      MARKET_PRICE_INTRADAY_ENABLED: ${MARKET_PRICE_INTRADAY_ENABLED:-true}
      MARKET_PRICE_INTRADAY_CRON: ${MARKET_PRICE_INTRADAY_CRON:-0 */15 * * * *}
      # 구매 리스크 점수 자동 축적 스케줄러(F5, 비로그인 대시보드용). 켜는 걸 깜빡하면 점수가
      # 안 쌓일 뿐이지만 끄는 걸 깜빡하면 LLM 비용이 실제로 나가고 되돌릴 수 없다 — 기본 off.
      # 수동 트리거(POST /api/v1/multi-agent/risk-scoring/run)는 이 플래그와 무관하게 항상 가능.
      RISK_SCORING_ENABLED: ${RISK_SCORING_ENABLED:-false}
      RISK_SCORING_BATCH_SIZE: ${RISK_SCORING_BATCH_SIZE:-10}
      RISK_SCORING_INTERVAL_MS: ${RISK_SCORING_INTERVAL_MS:-1800000}
      RISK_SCORING_INITIAL_DELAY_MS: ${RISK_SCORING_INITIAL_DELAY_MS:-120000}
      TZ: Asia/Seoul
    ports:
      - "${SPRING_PORT:-8080}:8080"
    volumes:
      - battery_spring_uploads:/app/uploads
      - ./data/ERP_data/spring-csv:/app/erp-seed
      - ./data/ERP_data/outbound-mock:/app/outbound-erp-seed
      - ./data/RAG_DATA/erp_aligned:/app/rag-seed
      - ./data/RAG_DATA/outbound_erp_aligned:/app/outbound-rag-seed

    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: battery-risk-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - spring
    restart: unless-stopped

volumes:
  battery_postgres_data:
  battery_chroma_data:
  battery_spring_uploads:
