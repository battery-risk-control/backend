server:
  port: 8080

spring:
  application:
    name: battery-risk-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/battery_risk}
    username: ${POSTGRES_USER:battery_app}
    password: ${POSTGRES_PASSWORD:battery_app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  upload:
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:10485760}
    root: ${UPLOAD_ROOT:../uploads}
