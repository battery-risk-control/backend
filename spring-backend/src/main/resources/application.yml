server:
  port: 8080
  # [성능] 응답 gzip 압축. 뉴스 목록·가격 시계열 등 JSON 응답이 수십 KB라 전송량이 크게 준다.
  # mime-types를 JSON으로 한정해 파일 다운로드(PDF/CSV, ErpImportReport·Document)는 대상에서
  # 제외한다 — 이미 압축된 바이너리를 다시 압축하는 낭비와 스트리밍 간섭을 피한다. 코드베이스에
  # SSE(text/event-stream)는 없다(2026-08-14 확인). 1KB 미만은 압축 오버헤드가 더 커 건너뛴다.
  # [ROLLBACK] 이 compression 블록만 지우면 무압축(기존 동작)으로 돌아간다.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

spring:
  application:
    name: battery-risk-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/battery_risk}
    username: ${POSTGRES_USER:battery_app}
    password: ${POSTGRES_PASSWORD:battery_app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # [커넥션 풀 설정] HikariCP: DB 커넥션을 미리 만들어두고 재사용하는 풀.
      # keepalive/max-lifetime은 죽은(half-open) 커넥션을 손님에게 건네기 전에
      # 앱이 스스로 감지·교체하게 해, Docker/방화벽의 유휴 TCP 끊김으로 생기는
      # 장시간 실행 시의 커넥션 확보 실패를 예방한다.
      # minimum-idle을 두지 않아 maximum-pool-size와 같은 '고정 크기 풀'로 동작한다
      # (HikariCP 권장). 항상 10개를 유지하므로 트래픽 급증 시 커넥션을 즉석 생성해
      # 발생하는 지연 스파이크가 없다.
      keepalive-time: 60000        # 60초마다 유휴 커넥션에 핑을 보내 살아있는지 확인
      max-lifetime: 1200000        # 커넥션 최대 수명 20분 → 인프라가 끊기 전에 먼저 재생성
      connection-timeout: 30000    # 커넥션을 못 얻을 때 대기 최대 30초(기본값, 순간부하 내성)
      maximum-pool-size: 10        # 고정 풀 크기(= 동시 DB 작업 상한). minimum-idle 미설정
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  mail:
    # [surin F10] 이메일 발송(JavaMailSender). host가 정의돼야 JavaMailSender 빈이 생성되어
    # EmailNotificationChannel이 주입받는다(SMTP_HOST 미설정 시 빈 host라 발송만 비활성, 부팅은 정상).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    # [surin F10] SMTP 미설정 시 mail 헬스체크가 /actuator/health를 DOWN으로 만들지 않도록 비활성화.
    mail:
      enabled: false

app:
  demo-gdelt:
    replay-enabled: ${DEMO_GDELT_REPLAY_ENABLED:false}
    replay-limit: ${DEMO_GDELT_REPLAY_LIMIT:16}
    max-attempts: ${DEMO_GDELT_MAX_ATTEMPTS:3}
  cors:
    # 4173 = Vite preview(프론트 e2e/Playwright 대상). 5173 = Vite dev. 3000 = CRA 기본.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
  exchange-rate:
    # 공개 대시보드 ② 환율 밴드. 한국수출입은행 현재환율 API(일일 1000회 제한)를 Spring이 직접 호출한다.
    # 구 도메인 www.koreaexim.go.kr은 2026-04-30 병행 가동 종료 — 반드시 oapi 도메인을 쓴다.
    base-url: ${KOREAEXIM_BASE_URL:https://oapi.koreaexim.go.kr}
    # 인증키 미설정이면 수집을 통째로 건너뛴다(부팅은 정상, 밴드만 빈다). 키 없이 호출하면
    # result=3만 돌아오므로 시도할 이유가 없다. 발급: koreaexim.go.kr > 인증키 발급신청.
    # 주의: 개인정보 보유기간 2년이 지나면 키가 파기된다(재동의 안내 메일 미응답 시).
    auth-key: ${KOREAEXIM_API_KEY:}
    # 자동 갱신(평일 11:20·16:00 KST). 무료 공개 API라 비용이 없어 기본 true다.
    scheduler-enabled: ${EXCHANGE_RATE_SCHEDULER_ENABLED:true}
    # 화면에 "노출할" 통화(수집 범위가 아니다 — 수집은 거래 가능한 전 통화를 담는다).
    # 여기 적은 순서가 곧 밴드 노출 순서이고, 추가하면 이미 쌓인 이력이 그대로 따라온다.
    #   USD·EUR  실제 결제통화(purchase_orders 92건: USD 49 / EUR 23 / KRW 20).
    #            KRW은 기준통화라 환율이 항상 1이므로 뺀다.
    #   나머지    결제는 USD·EUR로 하지만 조달이 걸린 나라들. 자재 비중 순으로 늘어놓았다
    #            (흑연 CNH / 리튬 CLP·AUD·ARS / 니켈 IDR·PHP / 코발트 CDF / 망간 ZAR).
    #   CLP·ARS·CDF·ZAR·BRL·PHP는 수출입은행이 고시하지 않아 재정환율로 만든다(아래 cross-rate).
    # 14종이 밴드에 많다 싶으면 줄여도 된다 — 빼도 수집은 계속되므로 되돌리기 쉽다.
    currencies: ${EXCHANGE_RATE_CURRENCIES:USD,EUR,CNH,CLP,AUD,IDR,CDF,ARS,ZAR,BRL,PHP,JPY,CAD,MYR}
    cross-rate:
      # 수출입은행이 고시하지 않는 조달국 통화를 USD 경유로 계산한다.
      #   CLP/KRW = (수출입은행 USD/KRW) / (외부소스 USD/CLP)
      # KRW 다리를 고시환율로 고정하는 것이 핵심 — 외부소스의 KRW를 쓰면 같은 밴드 안에서
      # 직접 고시 USD/KRW와 기준이 갈라진다.
      #
      # 주의: 두 소스의 스냅샷 시각이 섞이므로 표시용이다. 정산·회계 근거로는 쓸 수 없어
      # 응답에 cross_rate=true로 표시해 내려보낸다.
      # 오차 참고치: 무료 소스 두 곳(open.er-api·ECB) 비교 시 USD/KRW 0.29%, 재정환율 중앙값
      # 0.14%(최대 1.18%). 수출입은행 대비 실측은 인증키 발급 후에 확인해야 한다.
      #
      # 무료 등급 조건상 화면에 "Rates By Exchange Rate API" 링크 표기가 필요하다(footer).
      enabled: ${EXCHANGE_RATE_CROSS_ENABLED:true}
      base-url: ${EXCHANGE_RATE_CROSS_BASE_URL:https://open.er-api.com}
      # 칠레·아르헨티나(리튬) 콩고(코발트) 남아공(망간) 브라질 필리핀(니켈)
      currencies: ${EXCHANGE_RATE_CROSS_CURRENCIES:CLP,ARS,CDF,ZAR,BRL,PHP}
  market-price:
    # 공개 대시보드 원자재 가격 추이. FastAPI가 yfinance로 대표 종목 주가를 받아오고
    # Spring이 material_price_points에 (자재, 거래일) 복합키로 upsert한다.
    # 인증키가 필요 없는 공개 데이터라 호출 비용은 0이지만, yfinance는 Yahoo를 스크래핑하는
    # 비공식 경로라 SLA가 없고 빈도를 조이면 429가 날 수 있다 — 그래서 두 갱신을 나눠 둔다.
    #
    # 전체 갱신: 매일 07:00(KST), 180일. 미국 증시 마감 뒤라 전 거래일 종가가 확정돼 있다.
    #            끄면 가격 수집이 통째로 멈춘다.
    scheduler-enabled: ${MARKET_PRICE_SCHEDULER_ENABLED:true}
    # 장중 갱신: 15분 주기, 최근 5일. 일봉은 장중에도 당일 미완성 봉을 현재가로 채워 주므로
    #            차트 마지막 점이 실제로 움직인다. 종목이 미국·호주에 걸쳐 있어 대략
    #            KST 09:00~15:00(ASX)과 22:30~05:00(미국)에 값이 변하고, 그 밖에는 무동작이다.
    #            호출량은 종목 7개 × 96회 = 약 672회/일. 429가 잦으면 여기부터 끈다
    #            (끄더라도 전체 갱신은 살아 있어 차트가 하루 1회로 계속 갱신된다).
    intraday-enabled: ${MARKET_PRICE_INTRADAY_ENABLED:true}
    # 빈도만 낮추고 싶으면 여기를 바꾼다. 예: 30분 주기 "0 */30 * * * *"
    intraday-cron: ${MARKET_PRICE_INTRADAY_CRON:0 */15 * * * *}
  kg-service:
    # KG 리졸버 서비스(kg_service/, 결정사항 10번 1단계). 계약서 업로드가 새 계약을 만들면
    # 04_contracts.csv(+05_supplier_materials.csv)도 같이 갱신하고 여기다 리로드를 건다.
    base-url: ${KG_SERVICE_BASE_URL:http://localhost:8100}
    # KG 게이트. true면 KG가 부족을 확정한 건에 대해서만 멀티에이전트 브리핑을 자동 트리거한다.
    # false면 KG 확정 없이도 태운다 — KG 서버가 없는 개발·검증 환경용이다.
    #
    # 이름과 기본값을 FastAPI의 KG_GATE_ENABLED와 일부러 맞췄다. 같은 게이트가 두 군데 있기
    # 때문이다: Spring은 "멀티에이전트를 호출할지"를, FastAPI는 "그래프 안에서 KG 노드가
    # short-circuit할지"를 각각 판단한다. 한쪽만 내리면 나머지 한쪽에서 그대로 막힌다
    # (2026-08-03: FastAPI만 내려둔 탓에 자동 경로가 브리핑까지 도달하지 못했다).
    #
    # 기본 true인 이유는 risk-scoring.enabled와 반대다. 여기서 안전한 쪽은 "원래 설계대로
    # KG 근거가 있을 때만 태우는" 쪽이고, false는 근거 없이 공급사를 지목하게 만든다.
    gate-enabled: ${KG_GATE_ENABLED:true}
  upload:
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:52428800}
    root: ${UPLOAD_ROOT:../uploads}
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-override-in-env-32bytes+}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
    refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}
  erp:
    seed:
      enabled: ${ERP_SEED_ENABLED:false}
      directory: ${ERP_SEED_DIRECTORY:}
    outbound-seed:
      # 아웃바운드(products/product_compositions/customers/outbound_contracts) mock CSV 시드.
      # ErpSeedConfig(인바운드, 10개 파일 하드코딩)와 완전히 독립된 별도 러너(OutboundErpSeedConfig).
      enabled: ${OUTBOUND_ERP_SEED_ENABLED:false}
      directory: ${OUTBOUND_ERP_SEED_DIRECTORY:}
  rag:
    # RAG 계약서 자동 적재기(RagSeedConfig). enabled=true면 시작 시 directory의 계약서를 ChromaDB에 적재.
    seed:
      enabled: ${RAG_SEED_ENABLED:false}
      directory: ${RAG_SEED_DIRECTORY:}
      document-type: ${RAG_SEED_DOCUMENT_TYPE:CONTRACT}
    # 아웃바운드(LG엔솔→완성차 고객사) 계약서 자동 적재기(OutboundRagSeedConfig).
    # RagSeedConfig(인바운드)와 완전히 독립된 별도 러너 — outbound_contracts 테이블/
    # OutboundDocumentService를 쓴다는 점만 다르고 나머지 흐름은 동일.
    outbound-seed:
      enabled: ${OUTBOUND_RAG_SEED_ENABLED:false}
      directory: ${OUTBOUND_RAG_SEED_DIRECTORY:}
      document-type: ${OUTBOUND_RAG_SEED_DOCUMENT_TYPE:CONTRACT}
  auth:
    # refresh 토큰 HttpOnly 쿠키 속성. dev(http localhost)는 SameSite=Lax·Secure off로 동작하고,
    # 운영(https)에서는 REFRESH_COOKIE_SAME_SITE=None·REFRESH_COOKIE_SECURE=true로 올린다
    # (SameSite=None은 반드시 Secure=true여야 브라우저가 받는다).
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    # 접근통제(규제 가이드 제4조). 연속 실패 max-failures회 도달 시 lock-minutes분 잠근다.
    lockout:
      max-failures: ${AUTH_LOCKOUT_MAX_FAILURES:5}
      lock-minutes: ${AUTH_LOCKOUT_LOCK_MINUTES:5}
    # 로그인 실패가 이 횟수 이상 누적되면 캡챠를 요구한다(계정 잠금 전 단계).
    captcha-threshold: ${AUTH_CAPTCHA_THRESHOLD:3}
    # 비밀번호 유효기간(일). 초과 시 로그인에서 재설정을 요구한다.
    password:
      max-age-days: ${AUTH_PASSWORD_MAX_AGE_DAYS:90}
    # 운영용 관리자(ADMIN) 시드. 자격증명은 env로만 주입하고, 미설정이면 계정을 만들지 않는다.
    admin-seed:
      enabled: ${AUTH_ADMIN_SEED_ENABLED:false}
      username: ${AUTH_ADMIN_USERNAME:}
      password: ${AUTH_ADMIN_PASSWORD:}
      name: ${AUTH_ADMIN_NAME:시스템 관리자}
      email: ${AUTH_ADMIN_EMAIL:}
    # 프론트 e2e용 고정 테스트 계정 시드. 운영에는 끄고, CI/로컬 e2e에서만 true로 켠다.
    test-seed:
      enabled: ${AUTH_TEST_SEED_ENABLED:false}
      # 승인 완료 테스트 계정(구매·기획·임원)의 email 컬럼에 넣을 값. 비우면 각 @test.local을 쓴다.
      # F10 메일 검증 편의용 — 여기에 실제 받은편지함을 두면 psql 없이 재기동만으로 수신자가 바뀐다.
      # 발신 주소(mail-from)와 같은 값을 재사용한다(자기 자신에게 보내는 검증). 로그인 아이디(username)는
      # 그대로 @test.local이라 로그인엔 영향이 없다.
      recipient-email: ${NOTIFICATION_MAIL_FROM:}
  historical-data:
    # [surin F4] BDI/GDACS 과거 아카이브 적재 경로. 로컬 경로 하드코딩 대신 env로 외부화(미설정 시 적재 스킵).
    extra-path: ${HISTORICAL_DATA_EXTRA_PATH:}
  notification:
    # [surin F10] 알림 발신자 이메일 주소. 미설정 시 이메일 발송 비활성.
    mail-from: ${NOTIFICATION_MAIL_FROM:}
  collection:
    # [surin F4] 자동 수집 스케줄러(GDELT 자체 갱신 주기에 맞춰 15분). 기본 false — 무인 반복 실행으로
    # 인한 OpenAI 추출 비용 사고 방지. 자동 수집이 필요할 때만 COLLECTION_SCHEDULER_ENABLED=true 로 켠다.
    # 수동 트리거(POST /collection/run)는 이 플래그와 무관하게 항상 가능.
    scheduler-enabled: ${COLLECTION_SCHEDULER_ENABLED:false}
    # 수집된 뉴스에 대한 F3 분석 자동 트리거. false면 raw_events 저장까지만 하고 LLM 추출을 건너뛴다
    # (공개 뉴스 속보 패널은 수집 원본만으로 채워지므로 비용 없이 운영 가능).
    #
    # 기본 false. 스케줄러를 꺼두어도 수동 POST /collection/run 한 번이 수집된 뉴스 건수만큼 LLM 호출을
    # 발생시키기 때문이다(실제로 그렇게 30건이 호출된 적 있음). 실수의 대가가 비대칭이다 — 켜는 걸
    # 깜빡하면 분석이 안 생길 뿐 재실행하면 되지만, 끄는 걸 깜빡하면 실제 비용이 나가고 되돌릴 수 없다.
    # 비활성 상태는 CollectionService가 설정 키까지 찍어 INFO 로그로 알리고, 단건 검증용
    # POST /collection/test-news는 이 플래그의 영향을 받지 않으므로 분석 테스트 경로는 막히지 않는다.
    #
    # 주의: 환경변수는 이 줄이 있어야 바인딩된다 — COLLECTION_ANALYSIS_ENABLED만 넣고 여기를 빠뜨리면
    # CollectionService의 @Value 기본값으로 떨어져 이 설정이 조용히 무시된다. 그래서 @Value 기본값도
    # 여기와 같은 false로 맞춰 두었다(기본값이 세 군데로 갈라지지 않게).
    analysis-enabled: ${COLLECTION_ANALYSIS_ENABLED:false}
    # 영문 뉴스 제목 → 한국어 번역 스케줄러(5분 주기). 기본 false — LLM 호출이라 비용이 나간다.
    #
    # 수집·크롤링과 달리 이쪽만 비용이 있으므로 플래그를 따로 둔다. 분석(analysis-enabled)과도
    # 독립이다 — 뉴스 패널은 분석 없이 제목만 한국어면 성립하므로, 훨씬 싼 번역만 켜고 분석은
    # 끈 채로 운영할 수 있다(제목만 번역: 기사당 약 $0.00004, 본문까지 분석: 약 $0.0004).
    #
    # 수동 트리거(POST /collection/translate)는 이 플래그와 무관하게 항상 동작한다.
    translation-enabled: ${COLLECTION_TRANSLATION_ENABLED:false}
  multi-agent:
    # 자동 트리거된 브리핑에서 LLM 문장 생성을 쓸지. 원래 AnalysisService에 false로 박혀 있어서
    # 자동 경로는 규칙 기반 문장만 냈고 BRIEFING_USE_CLAUDE가 무효였다(그 플래그는 use_llm=true일
    # 때 provider를 고르는 것이다). 여기까지 오려면 COLLECTION_ANALYSIS_ENABLED=true로 이미 LLM
    # 비용을 감수한 상태이고 게이트 세 개를 통과한 소수 건이라 기본 true다.
    auto-briefing-use-llm: ${AUTO_BRIEFING_USE_LLM:true}
  risk-scoring:
    # 구매 리스크 점수 자동 축적 스케줄러(F5, 비로그인 대시보드용). 기본 false — 수집 스케줄러(F4)와
    # 같은 이유로, 켜는 걸 깜빡하면 점수가 안 쌓일 뿐이지만 끄는 걸 깜빡하면 LLM 비용이 실제로 나가고
    # 되돌릴 수 없다. 대가가 비대칭이라 안전한 쪽(off)이 기본이다. 수동 트리거
    # (POST /api/v1/multi-agent/risk-scoring/run)는 이 플래그와 무관하게 항상 가능.
    #
    # 환경변수는 이 줄이 있어야 바인딩된다 — RISK_SCORING_ENABLED만 넣고 여기를 빠뜨리면
    # MultiAgentOrchestrationService의 @Value 기본값으로 떨어져 조용히 무시된다(F4에서 겪은 문제
    # 재발 방지, @Value 기본값도 여기와 같은 false로 맞춰 뒀다).
    enabled: ${RISK_SCORING_ENABLED:false}
    # 1회 실행당 처리할 분석 수 상한(자재 2개인 대분류는 호출 2건이 됨).
    batch-size: ${RISK_SCORING_BATCH_SIZE:10}
    # 수집(15분)보다 길게 — 30분.
    interval-ms: ${RISK_SCORING_INTERVAL_MS:1800000}
    initial-delay-ms: ${RISK_SCORING_INITIAL_DELAY_MS:120000}
