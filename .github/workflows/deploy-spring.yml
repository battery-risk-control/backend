name: Deploy Spring to ECS

on:
  push:
    branches:
      - main
    paths:
      - "spring-backend/**"
      - "data/ERP_data/spring-csv/**"
      - "data/RAG_DATA/erp_aligned/**"
      - "data/ERP_data/outbound-mock/**"
      - "data/RAG_DATA/outbound_erp_aligned/**"
      - ".github/workflows/deploy-spring.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: supply-risk-spring-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "137192580656"
  ECR_REPOSITORY: supply-risk-spring
  ECS_CLUSTER: supply-risk-cluster
  ECS_SERVICE: supply-risk-spring-service
  CONTAINER_NAME: spring

jobs:
  deploy:
    name: Test, Build and Deploy Spring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: spring-backend/*.gradle*

      - name: Run Spring tests
        working-directory: spring-backend
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::137192580656:role/supply-risk-github-backend-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Spring image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --build-context erpseed=./data/ERP_data/spring-csv \
            --build-context ragseed=./data/RAG_DATA/erp_aligned \
            --build-context outbounderpseed=./data/ERP_data/outbound-mock \
            --build-context outboundragseed=./data/RAG_DATA/outbound_erp_aligned \
            -f ./spring-backend/Dockerfile \
            -t "$IMAGE_URI" \
            ./spring-backend

          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Download current ECS task definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query "taskDefinition" \
            > task-definition.json

      - name: Update Spring container image
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy Spring to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true