name: Deploy KG Service to ECS

on:
  push:
    branches:
      - main
    paths:
      - "kg_service/**"
      - "src/**"
      - "data/ERP_data/spring-csv/**"
      - "data_ref/outbound_mock/**"
      - ".github/workflows/deploy-kg.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: supply-risk-kg-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: supply-risk-kg
  ECS_CLUSTER: supply-risk-cluster
  ECS_SERVICE: supply-risk-kg-service
  CONTAINER_NAME: kg

jobs:
  deploy:
    name: Build and Deploy KG Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show safe OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          safe_claims = {
              key: claims.get(key)
              for key in (
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "ref",
                  "job_workflow_ref",
                  "environment",
              )
          }

          print(json.dumps(safe_claims, indent=2))
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::137192580656:role/supply-risk-github-backend-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push KG image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -f ./kg_service/Dockerfile \
            -t "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Download current ECS task definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].taskDefinition" \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query "taskDefinition" \
            > task-definition.json

      - name: Update KG container image
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy KG Service to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
