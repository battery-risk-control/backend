server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 문서 업로드가 최대 50MB이므로 여유 있게 허용한다.
    client_max_body_size 60m;

    # /api 요청은 같은 Docker 네트워크의 spring 컨테이너로 그대로 전달한다.
    # 브라우저 입장에서는 출입구(origin)가 nginx 하나뿐이라 CORS가 발생하지 않는다.
    location /api/ {
        proxy_pass http://spring:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 연결이 안 되면(백엔드 다운) 빨리 502를 반환한다 — 장애 시 60초 행 방지.
        proxy_connect_timeout 5s;
        # 응답 대기·전송은 넉넉히 — 문서 업로드/처리처럼 오래 걸리는 정상 작업이 잘리지 않도록.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA 라우팅: 정적 파일이 없으면 index.html로 돌려준다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
